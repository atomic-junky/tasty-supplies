version: 0.15.0-beta4
author: OneShrimpADay

data_pack:
  name: "TastySupplies_-_DataPack"
  description: "Data pack that adds over 100 new recipes to Minecraft!"
  pack_format: 107
  min_format: 80
  max_format: 107
  supported_formats: [ 80, 107 ]
  load: "src"
resource_pack:
  name: "TastySupplies_-_ResourcePack"
  description: "The offcial Resource pack for the Tasty Supplies Data pack!"
  pack_format: 88
  min_format: 63
  max_format: 88
  supported_formats: [ 63, 88 ]
  load: "src"

require:
- beet.contrib.log_level

meta:
  log_level:
    level: INFO

  # Vanilla assets the build reads from: item models to fall back on, and
  # textures to measure for the recipe book. Pinned on purpose.
  vanilla:
    version: "1.21"

  # Only these files go through Jinja; ts/templating.py says what they can call.
  render:
    data_pack:
      advancement: "tasty_supplies:*"
      loot_table: "minecraft:*"

pipeline:
- "ts.plugins.content"
- "ts.plugins.cookbook"
- "ts.plugins.emit"
- "ts.plugins.cutting_board"
- "ts.plugins.updater"
- "ts.plugins.locale"
- "beet.contrib.render"
- "beet.contrib.format_json"
- "beet.contrib.minify_function"

output: build
